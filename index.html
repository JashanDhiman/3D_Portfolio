<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050816" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Poppins is self-hosted from /fonts (see the note in src/index.css). The Google
       Fonts <link> that used to be here was render-blocking — Lighthouse measured ~923ms
       — and cost DNS/TLS to two extra origins for 1 KB of CSS.

       Deliberately NOT preloaded, which is the opposite of the usual advice and was
       decided by measurement. Preloading the two above-the-fold weights made real FCP on
       a throttled 1.6 Mbps connection *worse* — 852ms to 956ms — because 16 KB of fonts
       then competed for bandwidth with the stylesheet and react-vendor at the exact
       moment those gate the first paint. font-display: swap means text paints in the
       fallback face regardless, so the fonts have nothing to gain by arriving earlier and
       everything to lose by crowding out the render-critical bytes.

       Worth knowing that Lighthouse's simulated throttling reported this the other way
       around; the number above came from an actual throttled load. The @font-face rules
       in src/index.css are the only thing that requests them. -->

  <meta
   name="description"
   content="Jashan Dhiman - Full-Stack Developer with 4 years building HIPAA-compliant healthcare platforms in React and Node.js."
  />
  <meta
   name="keywords"
   content="Jashan Dhiman, Portfolio, Full Stack Developer, React Developer, Node.js, FHIR, HIPAA, Healthcare Software Engineer, Three.js"
  />
  <!-- Absolute URLs below are required: crawlers do not resolve relative paths, and a
       relative og:image is the most common reason a share card comes out blank. If the
       site moves to a custom domain, these four URLs and public/sitemap.xml are the only
       places that need changing. -->
  <link rel="canonical" href="https://jd-3d-portfolio.netlify.app/" />
  <meta property="og:url" content="https://jd-3d-portfolio.netlify.app/" />
  <meta property="og:site_name" content="Jashan Dhiman" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Jashan Dhiman | Full-Stack Developer" />
  <meta
   property="og:description"
   content="4 years building HIPAA-compliant healthcare platforms in React and Node.js. Projects, engineering notes, and contact."
  />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://jd-3d-portfolio.netlify.app/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta
   property="og:image:alt"
   content="Jashan Dhiman, Full-Stack Developer — software that handles real patient data."
  />
  <!-- summary_large_image is now correct: there is a real 1200x630 asset behind it.
       It previously claimed a large card with no image, which renders as a broken
       preview everywhere it is shared. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://jd-3d-portfolio.netlify.app/og.png" />

  <title>Jashan Dhiman | Full-Stack Developer</title>

  <!-- Person schema so search results can attribute the work and the profile links.
       Kept to facts stated elsewhere on the page. -->

   {

    "@type": "Person",

    "url": "https://jd-3d-portfolio.netlify.app/",

    "jobTitle": "Full-Stack Developer",
    "email": "mailto:jashandhiman.hulk@gmail.com",
    "description": "Full-Stack Developer building HIPAA-compliant healthcare platforms in React and Node.js.",
    "knowsAbout": [
     "React",
     "Node.js",
     "TypeScript",
     "PostgreSQL",
     "MongoDB",
     "FHIR",
     "HIPAA",
     "Three.js",
     "Web performance"
    ],
    "sameAs": ["https://github.com/JashanDhiman"]
   }
  </script>
 </head>
